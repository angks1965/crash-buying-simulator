<style>
  html,body{margin:0;padding:0;background:#f8f9fb;overflow-x:hidden;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
  @keyframes spin{to{transform:rotate(360deg)}}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-track{background:#f1f5f9}
  ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}

  /* ═══ Responsive layout ═══════════════════════════════════════════════════
     Inline styles hold colors/theme; layout that must change per breakpoint
     lives here as classes. A few rules need !important to win over an inline
     value set for the desktop default. */

  .cbs-app-hdr{flex-wrap:wrap;}
  .cbs-tab-bar{-webkit-overflow-scrolling:touch;scrollbar-width:thin;}

  .cbs-grid{display:grid;grid-template-columns:380px 1fr;gap:16px;padding:16px 24px 40px;align-items:start;}
  @media (max-width:900px){
    .cbs-grid{grid-template-columns:1fr;padding:12px 14px 32px;gap:12px;}
  }

  .cbs-trade-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1.4fr;gap:12px;padding:14px;}
  @media (max-width:640px){
    .cbs-trade-grid{grid-template-columns:1fr 1fr;}
  }

  .cbs-prev-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 14px;padding:8px 12px 12px;}
  @media (max-width:480px){
    .cbs-prev-grid{grid-template-columns:repeat(2,1fr);}
  }

  .cbs-chart-svg{width:100%;display:block;aspect-ratio:1200/220;touch-action:pan-y;cursor:crosshair;}
  @media (max-width:640px){
    .cbs-chart-svg{aspect-ratio:5/4;}
  }
  @media (max-height:480px) and (orientation:landscape){
    .cbs-chart-svg{aspect-ratio:2.6/1;}
  }

  @media (max-width:640px){
    .cbs-title{font-size:20px !important;}
    .cbs-card-hdr{font-size:10px !important;padding:8px 12px !important;}
    .cbs-tab-bar button{padding:9px 13px !important;font-size:11px !important;}
    .cbs-key-bar{padding:8px 14px !important;gap:8px !important;}
    .cbs-ticker-bar{padding:12px 14px 10px !important;}
    .cbs-ref-banner{margin:0 14px !important;}
  }

  @media (max-height:480px) and (orientation:landscape){
    .cbs-app-hdr{padding:8px 16px 0 !important;}
    .cbs-key-bar{padding:6px 16px !important;}
    .cbs-card-body{padding:6px 14px 8px !important;}
    .cbs-ticker-bar{padding:8px 16px 8px !important;}
  }

  /* Prevent iOS Safari auto-zoom-on-focus by keeping all inputs >=16px */
  @media (pointer:coarse){
    input[type="number"],input[type="text"]{font-size:16px !important;}
    .cbs-step-btn,.cbs-tab-bar button{min-height:40px;}
  }
</style>

// ═══ Pack / unpack ═══════════════════════════════════════════════════════════
// A packed series is {d0, dd, c}: first ISO date, base36 day-gaps, joined closes.
const B36="0123456789abcdefghijklmnopqrstuvwxyz";
function unpack(p){
  if(!p||!p.d0||!p.c) return [];
  const closes=p.c.split(",").map(Number);
  const out=new Array(closes.length);
  let t=Date.UTC(+p.d0.slice(0,4),+p.d0.slice(5,7)-1,+p.d0.slice(8,10));
  for(let i=0;i<closes.length;i++){
    if(i>0) t+=B36.indexOf(p.dd[i-1])*86400000;
    out[i]={date:new Date(t).toISOString().slice(0,10),close:closes[i]};
  }
  return out;
}
function pack(rows){
  if(!rows||!rows.length) return null;
  const day=s=>Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10))/86400000;
  let dd="";
  for(let i=1;i<rows.length;i++){
    const g=day(rows[i].date)-day(rows[i-1].date);
    dd+=(g>0&&g<36)?B36[g]:"1";
  }
  return {d0:rows[0].date,dd,c:rows.map(r=>+(+r.close).toFixed(2)).join(",")};
}

function instantRows(id){

  if(seed){ const r=unpack(seed); if(r.length>50) return {rows:r,source:"baked",label:"built-in seed"}; }

    const c=localStorage.getItem(cacheKey(id));
    if(c){ const{rows,ts}=JSON.parse(c); if(rows&&rows.length>50)

      const res=await fetch(mk(url),{signal:ctrl.signal}); clearTimeout(tid);
      if(!res.ok) continue;
      if(isJson){ const j=await res.json(); if(j) return j; }
      else { const t=await res.text(); if(t&&!t.trimStart().startsWith("<")&&t.includes(",")&&t.length>100) return t; }
    }catch(e){}
  }
  throw new Error("proxies unavailable");
}
function parseStooq(csv){
  const lines=csv.trim().split("\n");
  if(lines.length<2||!lines[0].toLowerCase().includes("close")) throw new Error("bad CSV");
  return lines.slice(1).map(l=>{const p=l.split(","),c=parseFloat(p[4]);
    return (!p[0]||isNaN(c)||c<=0)?null:{date:p[0].trim(),close:c};})
    .filter(Boolean).sort((a,b)=>a.date.localeCompare(b.date));
}
async function fetchYF(sym){
  const url=`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(sym)}?range=10y&interval=1d`;
  const j=await viaProxy(url,true), r=j?.chart?.result?.[0];
  const ts=r?.timestamp, cl=r?.indicators?.quote?.[0]?.close;
  if(!ts||!cl) throw new Error("YF empty");
  return ts.map((t,i)=>cl[i]>0?{date:new Date(t*1000).toISOString().slice(0,10),close:cl[i]}:null)
           .filter(Boolean).sort((a,b)=>a.date.localeCompare(b.date));
}
async function refreshHistory(t){
  try{
    const rows=parseStooq(await viaProxy(`https://stooq.com/q/d/l/?s=${t.stooq}&i=d&d1=20150101`,false));
    if(rows.length>50) return {rows,label:"Stooq"};
  }catch(e){}
  const rows=await fetchYF(t.yfSym);
  if(rows.length>50) return {rows,label:"Yahoo Finance"};
  throw new Error("no source reachable");
}
async function fetchQuote(t,fhKey){
  if(t.fhSym&&fhKey&&fhKey.length>5){
    const r=await fetch(`https://finnhub.io/api/v1/quote?symbol=${t.fhSym}&token=${fhKey}`,{signal:AbortSignal.timeout(8000)});
    if(r.ok){ const j=await r.json(); if(j.c) return {price:j.c,changePct:j.dp}; }
  }
  const url=`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(t.yfSym)}?range=1d&interval=1m`;
  const m=(await viaProxy(url,true))?.chart?.result?.[0]?.meta;
  if(!m?.regularMarketPrice) throw new Error("no quote");
  const pc=m.previousClose||m.chartPreviousClose||m.regularMarketPrice;
  return {price:m.regularMarketPrice, changePct:((m.regularMarketPrice-pc)/pc)*100};
}

// ═══ Formatters ══════════════════════════════════════════════════════════════
// Money is always "$". Index levels are POINTS — never prefixed with "$".
const nfmt=(n,d)=>Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const fmt$ =(n,d=2)=>(n==null||isNaN(n))?"—":`${n<0?"-":""}$${nfmt(n,d)}`;
const fmtPx=(n,isIndex,d=2)=>(n==null||isNaN(n))?"—":(isIndex?`${n<0?"-":""}${nfmt(n,d)}`:fmt$(n,d));
const fmtU =n=>(n==null||isNaN(n))?"0.0000":n.toLocaleString("en-US",{minimumFractionDigits:4,maximumFractionDigits:4});
const fmtDt=d=>new Date(typeof d==="string"?d+"T00:00:00":d).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
const dayN =(ds,ep)=>Math.round((new Date(ds+"T00:00:00")-ep)/86400000);
const ddColor=dd=>dd<=-0.10?"#c4352b":dd<=-0.05?"#c9862b":"#0d7c3f";

// Min/max bucket decimation — keeps peaks and troughs, caps SVG path cost.
function decimate(series,maxPts){
  const n=series.length;
  if(n<=maxPts) return series.map((s,i)=>({i,v:s.close}));
  const b=Math.ceil(n/maxPts), out=[];
  for(let s=0;s<n;s+=b){
    const e=Math.min(n,s+b); let lo=s,hi=s;
    for(let k=s;k<e;k++){ if(series[k].close<series[lo].close) lo=k; if(series[k].close>series[hi].close) hi=k; }
    const a=Math.min(lo,hi), z=Math.max(lo,hi);
    out.push({i:a,v:series[a].close}); if(z!==a) out.push({i:z,v:series[z].close});
  }
  if(out[out.length-1].i!==n-1) out.push({i:n-1,v:series[n-1].close});
  return out;
}

// ═══ Small chart-legend swatch ═══════════════════════════════════════════════
function LegendDot({color,label,dashed,round}){

        background:color,marginRight:5,verticalAlign:"middle",
        ...(dashed?{borderTop:`2px dashed ${color}`,background:"none",height:0,width:12,marginTop:0}:{})
      }}/>
      {label}
    </span>
  );
}

// ═══ Per-ticker simulator ════════════════════════════════════════════════════
function TickerSim({ticker,priceData,fhKey,refLast}){
  const IX = ticker.isIndex;
  const HUE = kindHue(ticker);
  const P  = (n,d)=>fmtPx(n,IX,d);          // price / index level
  const S  = styles;

  const txKey=`cbs_tx_v2_${ticker.id}`, cashKey=`cbs_cash_v2_${ticker.id}`;
  const [transactions,setTransactions]=useState(()=>{try{const s=localStorage.getItem(txKey);return s?JSON.parse(s):[];}catch(e){return [];}});
  const [startingCash,setStartingCash]=useState(()=>{try{const s=localStorage.getItem(cashKey);return s?parseFloat(s):200000;}catch(e){return 200000;}});
  const [editingCash,setEditingCash]=useState(false);
  const [cashDraft,setCashDraft]=useState("");
  const [action,setAction]=useState("BUY");
  const [amount,setAmount]=useState(0);
  const [activeTier,setActiveTier]=useState(null);
  const [activeEvent,setActiveEvent]=useState(null);
  const [hoverIdx,setHoverIdx]=useState(null);
  const [liveQuote,setLiveQuote]=useState(null);
  const chartRef=useRef(null);
  const dragRef=useRef(false);

  // ── Series: close + running peak + drawdown, computed once per data change ──
  const series=useMemo(()=>{
    let peak=-Infinity;
    return priceData.rows.map(r=>{ peak=Math.max(peak,r.close);
      return {date:r.date,close:r.close,peak,drawdown:(r.close-peak)/peak}; });
  },[priceData.rows]);

  const n=series.length;
  const epoch=useMemo(()=>n?new Date(series[0].date+"T00:00:00"):new Date(),[series,n]);

  // ── Day Pointer (1-based, mirrors Loo's model) ──────────────────────────────
  // Parks at the newest bar and follows the data forward when it refreshes.
  const [ptr,setPtr]=useState(0);
  const atEndRef=useRef(true);
  useEffect(()=>{ if(!n) return;
    setPtr(p=>{ const next=(p===0||atEndRef.current)?n:Math.min(p,n); atEndRef.current=(next===n); return next; });
  },[n]);
  const movePtr=useCallback(v=>{ setPtr(p=>{ const next=Math.max(1,Math.min(n||1,v)); atEndRef.current=(next===n); return next; }); },[n]);

  useEffect(()=>{
    const h=e=>{ if(/input|textarea/i.test(e.target.tagName)) return;
      if(e.key==="ArrowLeft"){e.preventDefault();movePtr(ptr-1);}
      if(e.key==="ArrowRight"){e.preventDefault();movePtr(ptr+1);} };
    window.addEventListener("keydown",h); return()=>window.removeEventListener("keydown",h);
  },[ptr,movePtr]);

  // ── Live quote, polled every 60s (never blocks anything) ────────────────────
  useEffect(()=>{
    let dead=false;
    const go=()=>fetchQuote(ticker,fhKey).then(q=>{if(!dead)setLiveQuote(q);}).catch(()=>{});
    go(); const id=setInterval(go,60000);
    return()=>{dead=true;clearInterval(id);};
  },[ticker.id,fhKey]);

  // ── CURRENT MARKET values, all as of the pointer ────────────────────────────
  const cur      = n?series[ptr-1]:null;
  const atLast   = ptr===n;
  const useLive  = atLast&&liveQuote&&liveQuote.price>0;
  const curPrice = useLive?liveQuote.price:(cur?cur.close:0);
  const peakToDate=cur?Math.max(cur.peak,curPrice):0;
  const curDD    = peakToDate>0?(curPrice-peakToDate)/peakToDate:0;
  const curDDPct = Math.abs(curDD)*100;

  const tierData=TIERS.map(t=>({...t,
    triggerPrice:peakToDate*(1-t.drawdown/100),
    amount:startingCash*(t.pct/100),
    triggered:curDDPct>=t.drawdown }));

  const portfolio=useMemo(()=>{
    let cash=startingCash,units=0;
    for(const tx of transactions){ if(tx.action==="BUY"){cash-=tx.amount;units+=tx.units;} else {cash+=tx.amount;units-=tx.units;} }
    const mktVal=units*curPrice, equity=cash+mktVal, pnl=equity-startingCash;
    return{cash,units,mktVal,equity,pnl,ret:startingCash?(pnl/startingCash)*100:0};
  },[transactions,curPrice,startingCash]);

  const persistTx=useCallback(next=>{ setTransactions(next); try{localStorage.setItem(txKey,JSON.stringify(next));}catch(e){} },[txKey]);
  function saveCash(v){ const x=parseFloat(v); if(isNaN(x)||x<=0) return;
    setStartingCash(x); try{localStorage.setItem(cashKey,String(x));}catch(e){} }

  // ── Trade preview (executes at the pointer's bar) ───────────────────────────
  const trPrice=cur?cur.close:0;
  const trUnits=trPrice>0?amount/trPrice:0;
  const trDay  =cur?dayN(cur.date,epoch):0;
  const trCash =action==="BUY"?portfolio.cash-amount:portfolio.cash+amount;
  const trUA   =action==="BUY"?portfolio.units+trUnits:portfolio.units-trUnits;
  const trEq   =trCash+trUA*trPrice;

  // ── Chart geometry ──────────────────────────────────────────────────────────
  const W=1200,H=220,PL=58,PR=20,PT=18,PB=22;
  const geo=useMemo(()=>{
    if(!n) return null;
    let lo=Infinity,hi=-Infinity;
    for(const s of series){ if(s.close<lo)lo=s.close; if(s.peak>hi)hi=s.peak; if(s.close>hi)hi=s.close; }
    const minC=lo*0.97,maxC=hi*1.03;
    return{minC,maxC,x:i=>PL+(n>1?i/(n-1):0)*(W-PL-PR),y:v=>PT+(1-(v-minC)/(maxC-minC))*(H-PT-PB)};
  },[series,n]);

  const linePath=useMemo(()=>{
    if(!geo) return "";
    return decimate(series,700,s=>s.close).map((p,k)=>`${k?"L":"M"}${geo.x(p.i).toFixed(1)},${geo.y(p.v).toFixed(1)}`).join(" ");
  },[series,geo]);

  const peakPath=useMemo(()=>{
    if(!geo) return "";
    return decimate(series,400,s=>s.peak).map((p,k)=>`${k?"L":"M"}${geo.x(p.i).toFixed(1)},${geo.y(p.v).toFixed(1)}`).join(" ");
  },[series,geo]);

  // Soft red fill under the price line while drawdown exceeds 10% — a gentler,
  // more "financial terminal" look than a hard-edged full-height band.
  const ddFills=useMemo(()=>{
    if(!geo) return [];
    const bands=[]; let st=null;
    for(let i=0;i<n;i++){
      if(series[i].drawdown<=-0.10&&st===null) st=i;
      if(series[i].drawdown>-0.10&&st!==null){bands.push([st,i-1]);st=null;}
    }
    if(st!==null) bands.push([st,n-1]);
    const base=H-PB;
    return bands.map(([s,e])=>{
      let d=`M${geo.x(s).toFixed(1)},${base}`;
      for(let i=s;i<=e;i++) d+=` L${geo.x(i).toFixed(1)},${geo.y(series[i].close).toFixed(1)}`;
      d+=` L${geo.x(e).toFixed(1)},${base} Z`;
      return d;
    });
  },[series,geo,n]);

  const yTicks=geo?[geo.minC,(geo.minC+geo.maxC)/2,geo.maxC]:[];
  const yearTicks=useMemo(()=>{
    const t=[]; let last=null;
    for(let i=0;i<n;i++){ const y=series[i].date.slice(0,4); if(y!==last){t.push({idx:i,year:y});last=y;} }
    return t;
  },[series,n]);

  const eventIdx=useCallback(d=>{ if(!d) return 0; const i=series.findIndex(s=>s.date>=d); return i<0?n-1:i; },[series,n]);
  const evMarkers=useMemo(()=>{
    if(!geo) return [];
    return EVENTS.filter(e=>e.date).map(e=>({...e,x:geo.x(eventIdx(e.date))}));
  },[geo,eventIdx]);

  // ── Unified pointer interaction: mouse hover previews, drag/touch scrubs
  //    continuously, release commits the Day Pointer — matches LCC's slide. ──
  function idxFromClientX(clientX){
    if(!geo||!chartRef.current) return null;
    const r=chartRef.current.getBoundingClientRect();
    const frac=(((clientX-r.left)/r.width*W)-PL)/(W-PL-PR);
    const i=Math.round(frac*(n-1));
    return (i>=0&&i<n)?i:null;
  }
  function onPointerDown(e){
    dragRef.current=true;
    try{ chartRef.current.setPointerCapture(e.pointerId); }catch(err){}
    const i=idxFromClientX(e.clientX); if(i!==null) setHoverIdx(i);
  }
  function onPointerMove(e){
    if(e.pointerType!=="mouse"&&!dragRef.current) return;
    const i=idxFromClientX(e.clientX); if(i!==null) setHoverIdx(i);
  }
  function onPointerUp(e){
    const i=idxFromClientX(e.clientX);
    if(i!==null) movePtr(i+1);
    if(e.pointerType!=="mouse") setHoverIdx(null);
    dragRef.current=false;
    try{ chartRef.current.releasePointerCapture(e.pointerId); }catch(err){}
  }
  function onPointerCancel(){ dragRef.current=false; }
  function onPointerLeave(){ if(!dragRef.current) setHoverIdx(null); }

  function execTrade(){
    if(!cur||amount<=0) return;
    persistTx([...transactions,{id:Date.now(),day:trDay,date:cur.date,price:trPrice,action,
      units:trUnits,amount,cashAfter:trCash,unitsAfter:trUA,equityAfter:trEq}]);
    setAmount(0);
  }
  function useTierFn(dd){
    setActiveTier(dd);
    const t=tierData.find(x=>x.drawdown===dd); if(!t) return;
    setAmount(t.amount); setAction("BUY");
    const i=series.findIndex(s=>s.close<=t.triggerPrice);
    if(i>=0) movePtr(i+1);
  }
  function smartSuggest(){
    const hit=[...tierData].reverse().find(t=>curDDPct>=t.drawdown);
    useTierFn(hit?hit.drawdown:tierData[0].drawdown);
  }
  function onEventClick(ev){ setActiveEvent(ev.label); movePtr(ev.date?eventIdx(ev.date)+1:1); }
  function resetPortfolio(){
    if(!window.confirm(`Reset all ${ticker.id} trades? This cannot be undone.`)) return;
    persistTx([]); setActiveTier(null); setAmount(0); setActiveEvent(null); movePtr(n);
  }
  function exportCSV(){
    const head=["#","Day","Date","Price","Action","Units","Amount","Cash After","Units After","Equity After"];
    const rows=transactions.map((t,i)=>[i+1,t.day,t.date,t.price.toFixed(2),t.action,t.units.toFixed(4),
      t.amount.toFixed(2),t.cashAfter.toFixed(2),t.unitsAfter.toFixed(4),t.equityAfter.toFixed(2)]);
    const csv=[head,...rows].map(r=>r.join(",")).join("\n");
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
    a.download=`crash_sim_${ticker.id}_${new Date().toISOString().slice(0,10)}.csv`;
    a.click(); URL.revokeObjectURL(a.href);
  }

  const srcTxt = priceData.source==="baked"  ? `Instant · ${priceData.label} · ${n} days`
               : priceData.source==="live"   ? `Refreshed · ${priceData.label} · ${n} days`
               : priceData.source==="cached" ? `Cache · ${priceData.cacheDate} · ${n} days`
               : priceData.source==="loading"? "Fetching history…"
               : "No data — press Refresh";
  const srcDot = priceData.source==="baked"?"#0d7c3f":priceData.source==="live"?"#0d7c3f"
               : priceData.source==="cached"?"#c9862b":priceData.source==="loading"?"#c9862b":"#c4352b";

  const hoverPt = (hoverIdx!==null&&series[hoverIdx])?series[hoverIdx]:null;
  const hoverPct = hoverPt&&geo ? Math.min(90,Math.max(2,(geo.x(hoverIdx)/W)*100)) : 50;

  return (
    <div>
      <div style={S.tickerBar} className="cbs-ticker-bar">
        <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
          <span style={S.tickerName}>{ticker.fullName}</span>
          <span style={{...S.kindTag,color:HUE,background:`${HUE}1a`,borderColor:`${HUE}59`}}>{IX?"INDEX":"ETF"}</span>
          {liveQuote&&(
            <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:12,fontWeight:700,
              color:liveQuote.changePct>=0?"#0d7c3f":"#c4352b"}}>
              {P(liveQuote.price)} {liveQuote.changePct>=0?"▲":"▼"}{Math.abs(liveQuote.changePct||0).toFixed(2)}%
            </span>
          )}
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{...S.dot,background:srcDot,...(priceData.source==="loading"?{animation:"pulse 1.2s infinite"}:{})}}/>
          <span style={S.statusTxt}>{srcTxt}</span>
        </div>
      </div>

      {/* Index reference banner */}
      {IX&&(
        <div style={S.refBanner} className="cbs-ref-banner">
          <div style={{fontWeight:700,color:HUE,marginBottom:6}}>{ticker.fullName} · Reference Only</div>
          <div style={{color:"#334155",lineHeight:1.6}}>
            This is the raw index tracker. It is <em>not directly purchasable</em>. To act on drawdown signals, buy one of these ETFs:
          </div>
          <div style={{display:"flex",gap:8,marginTop:10,flexWrap:"wrap"}}>
            {(ticker.buy||[]).map(t=>{
              const ratio=(refLast[ticker.id]&&refLast[t])?refLast[ticker.id]/refLast[t]:null;
              return (
                <span key={t} style={{...S.refChip,color:KIND_COLOR.etf,borderColor:`${KIND_COLOR.etf}80`,background:`${KIND_COLOR.etf}14`}}>
                  {t}{ratio?` · ≈ ${ticker.id} ÷ ${ratio<20?ratio.toFixed(1):Math.round(ratio)}`:""}
                </span>
              );
            })}
          </div>
        </div>
      )}

      <div style={S.grid} className="cbs-grid">
        <div style={S.leftCol}>

          {/* ═══ CURRENT MARKET ═══ */}
          <div style={S.card}>
            <div style={S.cardHdr} className="cbs-card-hdr">CURRENT MARKET <span style={S.cardHdrSub}>auto-updates by Day Pointer</span></div>
            <div style={S.cardBody} className="cbs-card-body">
              <div style={S.cmRow}>
                <span style={S.cmLabel}>Day Pointer</span>
                <div style={{display:"flex",alignItems:"center",gap:6,justifyContent:"flex-end"}}>
                  <button onClick={()=>movePtr(ptr-1)} style={S.stepBtn} className="cbs-step-btn" title="Previous day (←)">◀</button>
                  <input type="number" min={1} max={n||1} value={n?ptr:""} onChange={e=>movePtr(parseInt(e.target.value,10)||1)} style={S.dayInput}/>
                  <button onClick={()=>movePtr(ptr+1)} style={S.stepBtn} className="cbs-step-btn" title="Next day (→)">▶</button>
                  <span style={S.lastDay}>/ {n||"—"}</span>
                </div>
              </div>
              <div style={S.cmRow}>
                <span style={S.cmLabel}>Current Date</span>
                <span style={S.cmVal}>{cur?fmtDt(cur.date):"—"}{useLive&&<span style={S.liveTag}>LIVE</span>}</span>
              </div>
              <div style={S.cmRow}>
                <span style={S.cmLabel}>Current Price</span>
                <span style={{...S.cmVal,fontSize:17,fontWeight:700}}>{P(curPrice)}</span>
              </div>
              <div style={S.cmRow}>
                <span style={S.cmLabel}>Current Drawdown</span>
                <span style={{...S.cmVal,color:ddColor(curDD),fontWeight:700}}>
                  {curDD===0?"0.00%  ·  AT PEAK ▲":`${(curDD*100).toFixed(2)}%`}
                </span>
              </div>
              <div style={{...S.cmRow,borderBottom:"none"}}>
                <span style={S.cmLabel}>Peak To Date</span>
                <span style={{...S.cmVal,color:"#64748b",fontSize:13}}>{P(peakToDate)}</span>
              </div>

              <div style={{marginTop:16,marginBottom:22,position:"relative"}}>
                <div style={S.ddBar}>
                  <div style={{...S.ddBarFill,width:`${Math.min(100,(curDDPct/100)/DD_SCALE*100)}%`}}/>
                  {[10,15,20,25,30].map(v=>(
                    <span key={v} style={{...S.ddTick,left:`${(v/100)/DD_SCALE*100}%`}}>-{v}%</span>
                  ))}
                </div>
              </div>

              <div style={S.eventRow}>
                {EVENTS.map(ev=>(
                  <button key={ev.label} onClick={()=>onEventClick(ev)}
                    style={activeEvent===ev.label?{...S.pill,...S.pillActive}:S.pill}>{ev.label}</button>
                ))}
              </div>
            </div>
          </div>

          {/* ═══ PORTFOLIO ═══ */}
          <div style={S.card}>
            <div style={S.cardHdr} className="cbs-card-hdr">
              PORTFOLIO
              <button onClick={resetPortfolio} style={S.resetBtn}>↺ Reset</button>
            </div>
            <div style={S.cardBody} className="cbs-card-body">
              <div style={{...S.rowItem,alignItems:"center"}}>
                <span style={{color:"#64748b"}}>Starting Cash</span>
                {editingCash?(
                  <div style={{display:"flex",gap:4,alignItems:"center"}}>
                    <input autoFocus type="number" value={cashDraft} onChange={e=>setCashDraft(e.target.value)}
                      onKeyDown={e=>{if(e.key==="Enter"){saveCash(cashDraft);setEditingCash(false);}if(e.key==="Escape")setEditingCash(false);}}
                      style={S.cashInput}/>
                    <button onClick={()=>{saveCash(cashDraft);setEditingCash(false);}} style={S.cashSaveBtn}>✓</button>
                  </div>
                ):(
                  <button onClick={()=>{setCashDraft(String(startingCash));setEditingCash(true);}} style={S.cashEditBtn}>
                    {fmt$(startingCash,0)} ✎
                  </button>
                )}
              </div>
              <PRow label="Cash Balance" value={fmt$(portfolio.cash)} bold/>
              <PRow label="Units Held"   value={fmtU(portfolio.units)} bold/>
              <PRow label="Market Value" value={fmt$(portfolio.mktVal)} bold/>
              <div style={S.divider}/>
              <PRow label="Total Equity" value={fmt$(portfolio.equity)} highlight/>
              <PRow label="P&L"          value={fmt$(portfolio.pnl)} vcolor={portfolio.pnl>=0?"#0d7c3f":"#c4352b"}/>
              <PRow label="Return %"     value={`${portfolio.ret>=0?"+":""}${portfolio.ret.toFixed(2)}%`} vcolor={portfolio.ret>=0?"#0d7c3f":"#c4352b"}/>
            </div>
          </div>

          {/* ═══ ALLOCATION GUIDE ═══ */}
          <div style={S.card}>

                <LegendDot color="#1d4077" label="Price"/>
                <LegendDot color="#8da9c4" label="Peak" dashed/>

                <LegendDot color="#c4352b" label="Sell" round/>

            </div>
            {n?(
              <svg ref={chartRef} viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none"

                onPointerDown={onPointerDown} onPointerMove={onPointerMove} onPointerUp={onPointerUp}
                onPointerCancel={onPointerCancel} onPointerLeave={onPointerLeave}>
                {ddFills.map((d,i)=>(<path key={i} d={d} fill="#c4352b" opacity={0.09}/>))}
                {yTicks.map((v,i)=>(
                  <g key={i}>
                    <line x1={PL} x2={W-PR} y1={geo.y(v)} y2={geo.y(v)} stroke="#eef1f5" strokeWidth="1"/>
                    <text x={PL-6} y={geo.y(v)+4} textAnchor="end" style={S.axTxt}>{v>=1000?`${(v/1000).toFixed(1)}k`:v.toFixed(0)}</text>
                  </g>
                ))}
                {yearTicks.map((t,i)=>(
                  <g key={i}>
                    <line x1={geo.x(t.idx)} x2={geo.x(t.idx)} y1={PT} y2={H-PB} stroke="#f1f4f8" strokeWidth="1"/>
                    <text x={geo.x(t.idx)} y={H-5} textAnchor="middle" style={S.axTxt}>{t.year}</text>
                  </g>
                ))}
                {tierData.filter(t=>t.triggered).map(t=>(
                  <line key={t.drawdown} x1={PL} x2={W-PR} y1={geo.y(t.triggerPrice)} y2={geo.y(t.triggerPrice)}
                    stroke="#0d7c3f" strokeWidth="0.8" strokeDasharray="4,4" opacity={0.6}/>
                ))}
                <path d={peakPath} fill="none" stroke="#8da9c4" strokeWidth="1" strokeDasharray="4,3"/>
                <path d={linePath} fill="none" stroke="#1d4077" strokeWidth="1.6" strokeLinejoin="round"/>
                {evMarkers.map(ev=>(
                  <g key={ev.label}>
                    <line x1={ev.x} x2={ev.x} y1={PT} y2={H-PB} stroke="#c9862b" strokeWidth="1" strokeDasharray="3,3" opacity={0.7}/>
                    <text x={ev.x+3} y={PT+10} style={{...S.axTxt,fill:"#a3690f",fontSize:8}}>{ev.label.split(" ").slice(-1)[0]}</text>
                  </g>
                ))}
                {transactions.map(tx=>{
                  const i=series.findIndex(s=>s.date===tx.date);
                  return i<0?null:<circle key={tx.id} cx={geo.x(i)} cy={geo.y(series[i].close)} r="4"
                    fill={tx.action==="BUY"?"#0d7c3f":"#c4352b"} stroke="#fff" strokeWidth="1.5"/>;
                })}
                {cur&&(
                  <g>
                    <line x1={geo.x(ptr-1)} x2={geo.x(ptr-1)} y1={PT} y2={H-PB} stroke="#1e3a8a" strokeWidth="1" opacity={0.55}/>
                    <circle cx={geo.x(ptr-1)} cy={geo.y(cur.close)} r="5" fill="#c9862b" stroke="#1e293b" strokeWidth="1.5"/>
                  </g>
                )}
                {useLive&&(
                  <g>
                    <circle cx={geo.x(n-1)} cy={geo.y(liveQuote.price)} r="5" fill="#6366f1" stroke="#fff" strokeWidth="1.5"/>
                    <text x={geo.x(n-1)-6} y={geo.y(liveQuote.price)-8} textAnchor="end"
                      style={{...S.axTxt,fill:"#6366f1",fontSize:9,fontWeight:"bold"}}>LIVE {P(liveQuote.price)}</text>
                  </g>
                )}
                {hoverPt&&(
                  <g>
                    <line x1={geo.x(hoverIdx)} x2={geo.x(hoverIdx)} y1={PT} y2={H-PB} stroke="#94a3b8" strokeWidth="1" strokeDasharray="2,2"/>
                    <circle cx={geo.x(hoverIdx)} cy={geo.y(hoverPt.close)} r="3.5" fill="#1e293b"/>
                  </g>
                )}
              </svg>
            ):(
              <div style={S.chartEmpty}>
                {priceData.source==="loading"?(
                  <React.Fragment>
                    <div style={S.spinner}/>Fetching {ticker.id} price history…
                  </React.Fragment>
                ):`No ${ticker.id} data yet — press Refresh in the DATA bar, or bake a dataset.`}
              </div>
            )}
            {hoverPt&&(
              <div style={{...S.tooltip,left:`${hoverPct}%`}}>
                Day {hoverIdx+1} · {fmtDt(hoverPt.date)} · {P(hoverPt.close)} · DD {(hoverPt.drawdown*100).toFixed(1)}%
              </div>
            )}
            <div style={S.chartHint}>
              Drag or tap the chart to scrub · ← / → to step a day · release to set the Day Pointer
            </div>
          </div>

          {/* ═══ TRADE INPUT ═══ */}
          <div style={S.card}>
            <div style={S.cardHdr} className="cbs-card-hdr">TRADE INPUT <span style={S.cardHdrSub}>executes at Day {n?ptr:"—"}</span></div>
            <div style={S.tradeGrid} className="cbs-trade-grid">
              <div>
                <div style={S.fldLbl}>ACTION</div>
                <div style={S.actToggle}>
                  <button onClick={()=>setAction("BUY")}  style={action==="BUY"?S.buyA:S.buy}>BUY</button>
                  <button onClick={()=>setAction("SELL")} style={action==="SELL"?S.sellA:S.sell}>SELL</button>
                </div>
              </div>
              <div>
                <div style={S.fldLbl}>AMOUNT ($)</div>
                <input type="number" value={amount} onChange={e=>setAmount(parseFloat(e.target.value)||0)} style={S.inp}/>
              </div>
              <div>
                <div style={S.fldLbl}>UNITS (AUTO)</div>
                <input type="text" readOnly value={fmtU(trUnits)} style={S.inpRO}/>
              </div>
              <div style={{display:"flex",gap:8,alignItems:"flex-end"}}>
                <button onClick={smartSuggest} style={S.sugBtn} title="Jump to the deepest triggered tier">Suggest</button>
                <button onClick={execTrade} style={S.exeBtn}>Execute Trade</button>
              </div>
            </div>
            <div style={S.prevBox}>
              <div style={S.prevHdr}>TRADE PREVIEW</div>
              <div style={S.prevGrid} className="cbs-prev-grid">
                <PF label="DAY#"         value={n?ptr:"—"}/>
                <PF label="DATE"         value={cur?fmtDt(cur.date):"—"}/>
                <PF label={IX?"LEVEL":"PRICE"} value={P(trPrice)}/>
                <PF label="ACTION"       value={action} color={action==="BUY"?"#0d7c3f":"#c4352b"}/>
                <PF label="UNITS"        value={fmtU(trUnits)}/>
                <PF label="AMOUNT"       value={fmt$(amount)}/>
                <PF label="CASH AFTER"   value={fmt$(trCash)}/>
                <PF label="UNITS AFTER"  value={fmtU(trUA)}/>
                <PF label="EQUITY AFTER" value={fmt$(trEq)} bold/>
              </div>
            </div>
          </div>

          {/* ═══ TRANSACTION LOG ═══ */}
          <div style={S.card}>
            <div style={S.cardHdr} className="cbs-card-hdr">
              <span>TRANSACTION LOG <span style={S.cardHdrSub}>{transactions.length} trades logged</span></span>
              {transactions.length>0&&<button onClick={exportCSV} style={S.csvBtn}>Export CSV</button>}
            </div>
            {transactions.length===0?(
              <div style={S.empty}>No trades yet — move the Day Pointer to a date and execute a trade.</div>
            ):(
              <div style={{overflowX:"auto"}}>
                <table style={S.tbl}>
                  <thead><tr>
                    {["#","DAY","DATE",IX?"LEVEL":"PRICE","ACTION","UNITS","AMOUNT","CASH AFTER","UNITS AFTER","EQUITY AFTER",""].map(h=>(
                      <th key={h} style={S.th}>{h}</th>))}
                  </tr></thead>
                  <tbody>
                    {transactions.map((tx,i)=>(
                      <tr key={tx.id}>
                        <td style={S.td}>{i+1}</td>
                        <td style={S.td}>{tx.day}</td>
                        <td style={S.td}>{fmtDt(tx.date)}</td>
                        <td style={S.tdM}>{P(tx.price)}</td>
                        <td style={S.td}><span style={tx.action==="BUY"?S.buyTag:S.sellTag}>{tx.action}</span></td>
                        <td style={S.tdM}>{fmtU(tx.units)}</td>
                        <td style={S.tdM}>{fmt$(tx.amount)}</td>
                        <td style={S.tdM}>{fmt$(tx.cashAfter)}</td>
                        <td style={S.tdM}>{fmtU(tx.unitsAfter)}</td>
                        <td style={S.tdMB}>{fmt$(tx.equityAfter)}</td>
                        <td style={S.td}><button onClick={()=>persistTx(transactions.filter(t=>t.id!==tx.id))} style={S.delBtn}>×</button></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

function PRow({label,value,bold,highlight,vcolor}){
  return(
    <div style={{...styles.rowItem,...(highlight?styles.rowHL:{})}}>
      <span style={{color:"#64748b"}}>{label}</span>
      <span style={{fontFamily:"'JetBrains Mono',monospace",color:vcolor||"#1e293b",...((bold||highlight)?{fontWeight:700}:{})}}>{value}</span>
    </div>
  );
}
function PF({label,value,bold,color}){
  return(
    <div>
      <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:"#94a3b8",marginBottom:2}}>{label}</div>
      <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:13,color:color||"#1e293b",...(bold?{fontWeight:700}:{})}}>{value}</div>
    </div>
  );
}

// ═══ Root App ════════════════════════════════════════════════════════════════
function App(){
  const [activeTicker,setActiveTicker]=useState("SPX");
  const [fhKey,setFhKey]=useState(()=>getKey(FH_KEY));
  const [fhDraft,setFhDraft]=useState(()=>getKey(FH_KEY));
  const [showKeys,setShowKeys]=useState(false);
  const [busy,setBusy]=useState(null);

  // Synchronous first paint — baked / seeded / cached rows, zero network.
  const [priceStore,setPriceStore]=useState(()=>{
    const s={}; for(const t of TICKERS) s[t.id]=instantRows(t.id); return s;
  });

  const refLast=useMemo(()=>{
    const m={}; for(const t of TICKERS){ const r=priceStore[t.id]?.rows; if(r?.length) m[t.id]=r[r.length-1].close; }
    return m;
  },[priceStore]);

  const bakedCount=TICKERS.filter(t=>priceStore[t.id]?.source==="baked").length;

  // Parallel background refresh — every ticker at once, nothing blocks the UI.
  const refreshAll=useCallback(async(ids)=>{
    const list=(ids||TICKERS.map(t=>t.id));
    setBusy("refresh");
    setPriceStore(s=>{const c={...s}; list.forEach(id=>{ if(!c[id].rows.length) c[id]={...c[id],source:"loading"}; }); return c;});
    await Promise.allSettled(list.map(async id=>{
      const t=TICKERS.find(x=>x.id===id);
      try{
        const {rows,label}=await refreshHistory(t);
        toCache(id,rows);
        setPriceStore(s=>({...s,[id]:{rows,source:"live",label}}));
      }catch(e){
        setPriceStore(s=>s[id].rows.length?s:{...s,[id]:{...s[id],source:"empty"}});
      }
    }));
    setBusy(null);
  },[]);

  // Generates market-data.js — commit it beside index.html for instant loads.
  function bakeData(){
    const out={};
    for(const t of TICKERS){ const r=priceStore[t.id]?.rows; if(r?.length>50) out[t.id]=pack(r); }
    if(!Object.keys(out).length){ alert("No data loaded yet — press Refresh first."); return; }
    const body="/* Crash Buying Simulator — baked dataset\n   Generated "+new Date().toISOString().slice(0,10)+
      "\n   Commit this file next to index.html. Every tab then loads instantly,\n"+
      "   with no network calls and nothing for a corporate proxy to block. */\n"+
      "window.CBS_BAKED = "+JSON.stringify(out)+";\n";
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([body],{type:"text/javascript"}));
    a.download="market-data.js"; a.click(); URL.revokeObjectURL(a.href);
  }

  function applyKeys(){ const fh=fhDraft.trim(); saveKey(FH_KEY,fh); setFhKey(fh); setShowKeys(false); }

  const ticker=TICKERS.find(t=>t.id===activeTicker);

  return(
    <div style={styles.page}>
      <div style={styles.appHdr} className="cbs-app-hdr">
        <div>
          <div style={styles.eyebrow}>BACKTESTING SIMULATOR · DRAWDOWN-TRIGGERED DCA · DAILY DATA</div>
          <div style={styles.title} className="cbs-title">Crash Buying Simulator</div>
        </div>
        <div style={styles.kindLegend}>
          <span style={{...styles.kindLegendItem,color:KIND_COLOR.index}}><span style={{...styles.kindLegendDot,background:KIND_COLOR.index}}/>Index</span>
          <span style={{...styles.kindLegendItem,color:KIND_COLOR.etf}}><span style={{...styles.kindLegendDot,background:KIND_COLOR.etf}}/>ETF</span>
        </div>
      </div>

      {/* DATA bar */}
      <div style={styles.keyBar} className="cbs-key-bar">
        <span style={styles.keyLabel}>DATA</span>
        <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:"#334155"}}>
          {bakedCount} of {TICKERS.length} tabs load instantly from baked data
        </span>
        <button onClick={()=>refreshAll()} disabled={busy==="refresh"} style={styles.keyApplyBtn}>
          {busy==="refresh"?"⟳ Refreshing…":"⟳ Refresh"}
        </button>
        <button onClick={bakeData} style={styles.keyChangeBtn} title="Download market-data.js — commit it beside index.html so every tab loads instantly with no network calls">
          ⬇ Bake data
        </button>
        <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:8}}>
          <span style={styles.keySubLabel}>Finnhub key (optional — live quotes only):</span>
          {showKeys?(
            <div style={{display:"flex",gap:6,alignItems:"center"}}>
              <input type="text" placeholder="Paste Finnhub key…" value={fhDraft}
                onChange={e=>setFhDraft(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")applyKeys();}}
                style={{...styles.keyInput,width:180}}/>
              <button onClick={applyKeys} style={styles.keyApplyBtn}>Save</button>
              <a href="https://finnhub.io/register" target="_blank" rel="noopener" style={styles.keyLink}>Get free ↗</a>
            </div>
          ):(
            <button onClick={()=>setShowKeys(true)} style={styles.keyChangeBtn}>
              {fhKey?`Finnhub ****${fhKey.slice(-4)}`:"+ Add Finnhub key"}
            </button>
          )}
        </div>
      </div>

      {/* Tabs — index vs ETF get distinct accent colors; only active tab mounts */}
      <div style={styles.tabBar} className="cbs-tab-bar">
        {TICKERS.map(t=>{
          const st=priceStore[t.id]?.source;
          const hue=kindHue(t);
          const isActive=activeTicker===t.id;
          return(
            <button key={t.id} onClick={()=>setActiveTicker(t.id)}
              style={isActive?{...styles.tab,color:hue,borderBottomColor:hue,fontWeight:700}:styles.tab}>
              {t.label}
              <span style={{display:"inline-block",width:5,height:5,borderRadius:"50%",marginLeft:5,verticalAlign:"middle",
                background:st==="baked"||st==="live"?"#0d7c3f":st==="cached"?"#c9862b":st==="loading"?"#c9862b":"#cbd5e1"}}/>
            </button>
          );
        })}
      </div>

      <TickerSim key={activeTicker} ticker={ticker}
        priceData={priceStore[activeTicker]||{rows:[],source:"empty"}} fhKey={fhKey} refLast={refLast}/>
    </div>
  );
}
